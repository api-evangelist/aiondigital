aid: aiondigital
name: Aion Digital
description: 'Aion Digital is a Bahrain-headquartered digital banking platform vendor,
  operated by Waqfe W.L.L and founded in 2017, that sells bank-in-a-box software to
  financial institutions across the GCC and Pakistan. Its product lines are eKYC and
  digital onboarding, retail digital banking, corporate digital banking, an AI layer
  (Aion Hikmah) and the Aion Rubix platform, whose marketed components include an API
  gateway, an API management and analytics platform, and modular middleware with
  pre-integrations. Aion Digital markets an API platform and, through a 2019 Open Bank
  Project partnership, an API catalogue and sandbox delivered to its bank customers,
  but it publishes no public developer portal, API reference, or machine-readable
  contract of its own: every developer-facing call to action on aiondigital.com and
  ekyc.aiondigital.com is "Request a demo". The one public first-party code it does
  ship is a small set of internal platform libraries on npm and an iOS analytics
  framework on GitHub.'
