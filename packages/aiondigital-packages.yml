note: >-
  Aion Digital publishes no client SDK for any Aion Digital API, because it publishes no public
  API. What it does publish is internal platform code: two npm packages under its own
  @aiondigital scope and one iOS analytics framework in its engineering GitHub org. No
  `SDKs` pointer is emitted in apis.yml on purpose — sdk_count is meant to count developer-facing
  client libraries that wrap a provider's API, and none of these three do. PyPI, RubyGems,
  Packagist, crates.io, NuGet, Maven Central and pkg.go.dev returned nothing first-party.
ownership_check: >-
  The @aiondigital npm scope, the github.com/aiondigital organization (name "Aion Digital",
  blog www.aiondigital.com, location Bahrain) and github.com/aiondigitalengineering (name
  "Aion Digital Engineering") are all first-party. The messaging-queues source repository sits
  in a maintainer's personal GitHub account (wjamilaion) but the package is published under the
  company scope by the same npm maintainer as the opentelemetry package.
